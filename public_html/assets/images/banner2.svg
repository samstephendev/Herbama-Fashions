<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="b2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F0"/>
      <stop offset="60%" stop-color="#EFEAE1"/>
      <stop offset="100%" stop-color="#E2DCD1"/>
    </linearGradient>
    <linearGradient id="maroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1F3D"/>
      <stop offset="100%" stop-color="#5B1229"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#9B7828"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#b2Grad)"/>
  
  <circle cx="950" cy="250" r="210" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="950" cy="250" r="195" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-dasharray="6,6"/>

  <!-- Right Side Kidswear Illustration (Boys Shirt / Dungaree Motif) -->
  <g transform="translate(850, 100)">
    <path d="M 60,80 L 140,80 L 160,140 L 130,150 L 130,220 L 70,220 L 70,150 L 40,140 Z" fill="url(#maroon)"/>
    <path d="M 85,80 L 100,105 L 115,80 Z" fill="url(#gold)"/>
    <!-- Dungaree Straps & Pants -->
    <path d="M 70,180 L 130,180 L 140,320 L 105,320 L 100,240 L 95,320 L 60,320 Z" fill="#2B2B2B" opacity="0.85"/>
    <rect x="85" y="195" width="30" height="25" rx="3" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="80" cy="180" r="4" fill="url(#gold)"/>
    <circle cx="120" cy="180" r="4" fill="url(#gold)"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="165" height="30" rx="15" fill="#7A1F3D"/>
    <text x="82.5" y="20" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#FFF9F3" text-anchor="middle" letter-spacing="2">BOYS ESSENTIALS</text>
    
    <text x="0" y="85" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#7A1F3D">
      <tspan x="0" dy="0">Trendy &amp; Tough for</tspan>
      <tspan x="0" dy="55" fill="#C9A24B" font-style="italic">Active Little Heroes</tspan>
    </text>

    <text x="0" y="210" font-family="'Poppins', sans-serif" font-size="16" fill="#5C3D4E">
      <tspan x="0" dy="0">Breathable cotton shirts, cargo shorts and smart ethnic sets</tspan>
      <tspan x="0" dy="26">designed for endless fun, comfort, and playtime.</tspan>
    </text>

    <g transform="translate(0, 280)">
      <circle cx="10" cy="10" r="5" fill="#25D366"/>
      <text x="25" y="15" font-family="'Poppins', sans-serif" font-size="13" font-weight="500" fill="#2B2B2B">100% Pure Soft Cotton</text>
      
      <circle cx="210" cy="10" r="5" fill="#C9A24B"/>
      <text x="225" y="15" font-family="'Poppins', sans-serif" font-size="13" font-weight="500" fill="#2B2B2B">Custom Fit in 5 Days</text>
    </g>
  </g>
</svg>
