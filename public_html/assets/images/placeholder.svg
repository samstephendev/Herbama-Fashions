<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F3"/>
      <stop offset="100%" stop-color="#FCEEEA"/>
    </linearGradient>
    <linearGradient id="maroonG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1F3D"/>
      <stop offset="100%" stop-color="#5B1229"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#9B7828"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#cardBg)"/>
  
  <!-- Subtle background dots/stars -->
  <g fill="#7A1F3D" opacity="0.08">
    <circle cx="80" cy="120" r="4"/>
    <circle cx="520" cy="140" r="5"/>
    <circle cx="480" cy="620" r="4"/>
    <circle cx="100" cy="580" r="5"/>
    <polygon points="120,200 125,215 140,215 128,225 132,240 120,230 108,240 112,225 100,215 115,215"/>
    <polygon points="480,300 484,312 496,312 486,320 490,332 480,324 470,332 474,320 464,312 476,312"/>
  </g>

  <!-- Circular Motif -->
  <circle cx="300" cy="340" r="160" fill="#FFFFFF" opacity="0.85" stroke="#C9A24B" stroke-width="2" stroke-dasharray="6,4"/>
  
  <!-- Stylized Kidswear Hanger Icon -->
  <g stroke="url(#maroonG)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Hook -->
    <path d="M 300, 240 C 300, 215 320, 215 320, 230 C 320, 245 300, 255 300, 275"/>
    <!-- Triangular Hanger -->
    <path d="M 220, 325 L 300, 275 L 380, 325 Z"/>
    <!-- Dress / Outfit outline -->
    <path d="M 260, 325 L 240, 420 L 360, 420 L 340, 325"/>
    <path d="M 240, 420 Q 300, 435 360, 420" stroke-width="4"/>
  </g>
  
  <!-- Bow Motif -->
  <path d="M 285, 325 C 275, 315 275, 335 285, 325 Z M 315, 325 C 325, 315 325, 335 315, 325 Z" fill="url(#goldG)"/>
  <circle cx="300" cy="325" r="4" fill="url(#goldG)"/>

  <!-- Brand Typography -->
  <text x="300" y="540" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="#7A1F3D" text-anchor="middle" letter-spacing="2">HERBAMA FASHIONS</text>
  <text x="300" y="575" font-family="'Poppins', sans-serif" font-size="14" font-weight="500" fill="#C9A24B" text-anchor="middle" letter-spacing="3">HANDCRAFTED KIDSWEAR</text>
  
  <!-- Subtle border -->
  <rect x="20" y="20" width="560" height="710" fill="none" stroke="#C9A24B" stroke-width="1" opacity="0.3" rx="16"/>
</svg>
